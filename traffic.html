<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Traffic Insights Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: #0c0a09; color: #d1d5db; }
        .background-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; }
        .blob1 { width: 400px; height: 400px; top: -150px; left: -150px; background: #818cf8; animation: move 25s infinite alternate; }
        .blob2 { width: 300px; height: 300px; bottom: -100px; right: -100px; background: #4f46e5; animation: move 30s infinite alternate-reverse; }
        .blob3 { width: 250px; height: 250px; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #7c3aed; animation: move 20s infinite alternate; }
        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(200px, 100px) scale(1.2); }
        }
        .glass-ui { background: rgba(30, 30, 40, 0.45); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .input-field { background: rgba(17, 24, 39, 0.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .stat-card { background: rgba(17, 24, 39, 0.5); }
        #scroll-wrapper::-webkit-scrollbar { width: 8px; }
        #scroll-wrapper::-webkit-scrollbar-track { background: transparent; }
        #scroll-wrapper::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        #scroll-wrapper::-webkit-scrollbar-thumb:hover { background: #718096; }
        .details-section { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .details-section.open { max-height: 1000px; transition: max-height 0.5s ease-in; }
    </style>
</head>
<body class="text-gray-200">

    <div class="background-container"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>

    <div id="scroll-wrapper" class="h-full overflow-y-auto p-4 sm:p-6 w-full">
        <div class="w-full max-w-5xl mx-auto">
            <div class="glass-ui rounded-2xl p-6 sm:p-8">
                <header class="text-center mb-8">
                    <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-400">GitHub Traffic Insights</h1>
                    <p class="text-gray-400 mt-2">Enter your GitHub Personal Access Token to see detailed traffic stats.</p>
                </header>

                <div class="space-y-4 mb-6 max-w-xl mx-auto">
                     <div>
                        <label for="githubTokenInput" class="text-sm font-medium text-gray-400">Personal Access Token (PAT)</label>
                        <input type="password" id="githubTokenInput" class="input-field mt-1 w-full rounded-lg py-3 pl-5 pr-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="ghp_...">
                    </div>
                </div>
                 <div class="text-center mb-8">
                     <button id="getStatsBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-md transition-transform transform hover:scale-105">Fetch Traffic Data</button>
                </div>

                <main id="results" class="space-y-4"></main>
            </div>
            <footer class="text-center text-gray-600 text-xs mt-8 pb-4">
                 <p>A Personal Access Token with the <code class="bg-gray-800 p-1 rounded-md text-indigo-300">repo</code> scope is required.</p>
            </footer>
        </div>
    </div>

    <script>
        const tokenInput = document.getElementById('githubTokenInput');
        const getStatsBtn = document.getElementById('getStatsBtn');
        const resultsContainer = document.getElementById('results');
        const GITHUB_API_BASE = 'https://api.github.com';
        
        Chart.defaults.color = '#9ca3af';
        Chart.defaults.borderColor = 'rgba(156, 163, 175, 0.1)';

        getStatsBtn.addEventListener('click', handleFetch);
        tokenInput.addEventListener('keyup', (e) => e.key === 'Enter' && handleFetch());

        async function handleFetch() {
            const token = tokenInput.value.trim();
            if (!token) {
                resultsContainer.innerHTML = `<div id="message" class="text-center text-gray-500 py-10"><p>Please enter a Personal Access Token.</p></div>`;
                return;
            }

            resultsContainer.innerHTML = `<div id="loader" class="flex flex-col items-center justify-center text-center text-gray-400 py-10"><svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="mt-4">Fetching data...</p></div>`;
            
            try {
                const user = await fetchGitHubAPI(`${GITHUB_API_BASE}/user`, token);
                const repos = await fetchGitHubAPI(`${GITHUB_API_BASE}/users/${user.login}/repos?per_page=100&sort=pushed`, token);

                if (repos.length === 0) throw new Error(`No public repositories found for user '${user.login}'.`);

                const statsPromises = repos.map(repo => getRepoTraffic(repo.owner.login, repo.name, token));
                const allStats = (await Promise.all(statsPromises)).filter(Boolean);
                
                // MODIFIED: The .sort() method is now hardcoded to sort by views descending
                const validStats = allStats
                    .filter(s => s.views.count > 0 || s.clones.count > 0)
                    .sort((a, b) => b.views.count - a.views.count);

                resultsContainer.innerHTML = '';
                if (validStats.length === 0) throw new Error('No repositories with traffic data found.');
                
                validStats.forEach(displayTrafficStat);

            } catch (error) {
                console.error('Error fetching stats:', error);
                resultsContainer.innerHTML = `<div id="message" class="text-center text-red-400 py-10"><p>Error: ${error.message}</p></div>`;
            }
        }

        async function fetchGitHubAPI(url, token) {
            const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}` };
            const response = await fetch(url, { headers });
            if (!response.ok) {
                if (response.status === 401) throw new Error('Bad credentials. Check your token.');
                if (response.status === 403) throw new Error('Forbidden. Your token may lack `repo` scope or you hit a rate limit.');
                throw new Error(`API request failed with status ${response.status}.`);
            }
            return response.json();
        }

        async function getRepoTraffic(owner, repo, token) {
            try {
                const [views, clones, referrers, paths] = await Promise.all([
                    fetchGitHubAPI(`${GITHUB_API_BASE}/repos/${owner}/${repo}/traffic/views`, token),
                    fetchGitHubAPI(`${GITHUB_API_BASE}/repos/${owner}/${repo}/traffic/clones`, token),
                    fetchGitHubAPI(`${GITHUB_API_BASE}/repos/${owner}/${repo}/traffic/popular/referrers`, token),
                    fetchGitHubAPI(`${GITHUB_API_BASE}/repos/${owner}/${repo}/traffic/popular/paths`, token)
                ]);
                return { repoName: `${owner}/${repo}`, views, clones, referrers, paths };
            } catch (error) {
                console.warn(`Could not fetch traffic for ${owner}/${repo}: ${error.message}`);
                return null;
            }
        }

        function displayTrafficStat(stat) {
            const repoId = stat.repoName.replace(/[\/.]/g, '-');
            const card = document.createElement('div');
            card.className = 'stat-card glass-ui rounded-lg p-5';
            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between sm:items-center">
                    <h2 class="text-xl font-semibold text-indigo-400 mb-3 sm:mb-0">
                        <a href="https://github.com/${stat.repoName}" target="_blank" rel="noopener noreferrer" class="hover:underline">${stat.repoName}</a>
                    </h2>
                    <div class="flex items-center space-x-6">
                        <div class="text-center"><p class="text-lg font-bold text-green-300">${stat.views.count.toLocaleString()}</p><p class="text-xs text-gray-500">Views</p></div>
                        <div class="text-center"><p class="text-lg font-bold text-purple-400">${stat.clones.count.toLocaleString()}</p><p class="text-xs text-gray-500">Clones</p></div>
                        <button id="toggle-${repoId}" class="bg-gray-700/50 hover:bg-gray-600/50 text-xs font-semibold py-2 px-3 rounded-md">Show Details</button>
                    </div>
                </div>
                <div id="details-${repoId}" class="details-section border-t border-gray-200/10 mt-4 pt-4">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div><h3 class="text-lg font-semibold mb-2 text-gray-300">Views (14 days)</h3><canvas id="views-chart-${repoId}"></canvas></div>
                        <div><h3 class="text-lg font-semibold mb-2 text-gray-300">Clones (14 days)</h3><canvas id="clones-chart-${repoId}"></canvas></div>
                        <div><h3 class="text-lg font-semibold mb-2 text-gray-300">Top Referring Sites</h3><ul id="referrers-list-${repoId}" class="space-y-1 text-sm"></ul></div>
                        <div><h3 class="text-lg font-semibold mb-2 text-gray-300">Popular Content</h3><ul id="paths-list-${repoId}" class="space-y-1 text-sm"></ul></div>
                    </div>
                </div>`;
            resultsContainer.appendChild(card);
            
            const toggleButton = document.getElementById(`toggle-${repoId}`);
            const detailsSection = document.getElementById(`details-${repoId}`);
            
            toggleButton.addEventListener('click', () => {
                const isOpen = detailsSection.classList.toggle('open');
                toggleButton.textContent = isOpen ? 'Hide Details' : 'Show Details';

                if (isOpen && !detailsSection.dataset.rendered) {
                    renderCharts(stat, repoId);
                    populateList(document.getElementById(`referrers-list-${repoId}`), stat.referrers, item => `${item.referrer}`);
                    populateList(document.getElementById(`paths-list-${repoId}`), stat.paths, item => `<a href="https://github.com${stat.repoName}/blob/master${item.path}" target="_blank" rel="noopener noreferrer" class="hover:underline text-indigo-400">${item.path}</a>`);
                    detailsSection.dataset.rendered = 'true';
                }
            });
        }

        function renderCharts(stat, repoId) {
            const viewsCtx = document.getElementById(`views-chart-${repoId}`).getContext('2d');
            const clonesCtx = document.getElementById(`clones-chart-${repoId}`).getContext('2d');
            const labels = stat.views.views.map(v => new Date(v.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
            
            new Chart(viewsCtx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Total Views', data: stat.views.views.map(v => v.count), borderColor: '#4ade80', tension: 0.1, fill: false },
                        { label: 'Unique Visitors', data: stat.views.views.map(v => v.uniques), borderColor: '#818cf8', tension: 0.1, fill: false }
                    ]
                }
            });

            new Chart(clonesCtx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Total Clones', data: stat.clones.clones.map(c => c.count), borderColor: '#c084fc', tension: 0.1, fill: false },
                        { label: 'Unique Cloners', data: stat.clones.clones.map(c => c.uniques), borderColor: '#f472b6', tension: 0.1, fill: false }
                    ]
                }
            });
        }
        
        function populateList(listElement, data, formatLabel) {
            if (data.length === 0) {
                listElement.innerHTML = `<li class="text-gray-500">No data available.</li>`;
                return;
            }
            data.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-500/10 p-2 rounded-md';
                li.innerHTML = `<span class="truncate pr-4">${formatLabel(item)}</span><span class="font-semibold text-gray-300">${item.count.toLocaleString()} <span class="text-gray-500">(${item.uniques.toLocaleString()} unique)</span></span>`;
                listElement.appendChild(li);
            });
        }
    </script>
</body>
</html>
